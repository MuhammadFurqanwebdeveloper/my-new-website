<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Condensed&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" media="screen" href="styles/common.css" />
    <link rel="stylesheet" type="text/css" media="screen" href="styles/nav.css" />
    <link rel="stylesheet" type="text/css" media="screen" href="styles/contact.css" />
    <link rel="stylesheet" href="styles/media-queries.css" />
</head>
<body>
    <div class="skewed-header">
        <div class="header-bg" style="background-image: url('images/backgrounds/contact.jpg');"></div>
        <div class="skewed-header-wrapper">
            <div class="skewed-header-content">
                <div class="heading-wrapper">
                    <h1>
                        Contact
                    </h1>
                </div>
                <div class="links-wrapper">
                    <div class="nav-link">
                        <a href="index.html">Home</a>
                    </div> 

                    <div class="nav-link">
                        <a href="about.html">About</a>
                    </div>

                    <div class="nav-link">
                        <a href= "menu.html">Menu</a>
                    </div>

                    <div class="nav-link">
                        <a href="contact.html">Contact</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="contact-page-container">
        <div class="grid-wrapper">
            <div class="sidebar-wrapper">
                <div class="sidebar-logo">
                    <img src="images/backgrounds/decamp-fantastic-fries-logo-dark.png" alt="logo" />
                </div>
                <div class="details-wrapper">
                    <img src="images/icons/pin.png" >
                    <div>
                        123 Any St<br>Scottsdale, AZ, 85251
                    </div>
                </div>
                <div class="details-wrapper">
                    <img src="images/icons/call.png" >
                    <div>
                        555 555 5555
                    </div>
                </div>
                <div class="details-wrapper">
                    <img src="images/icons/clock.png" >
                    <div>
                        10 AM - MIDNIGHT
                    </div>
                </div>
            </div>
            <div class="form">
                <div class="form-group">
                    <input type="text" id="fullname" placeholder="Your name">
                    <label for="fullname">Your name</label>
                </div>
                <div class="form-group">
                    <input type="text" id="email" placeholder="Your email">
                    <label for="email">Your email</label>
                </div>
                <div class="form-group">
                    <textarea name="message" id="message" placeholder="Message"></textarea>
                    <label for="message">Message</label>
                </div>
                <div class="spacer10"></div>
                <div class="centered-btn-wrapper">
                    <button type="submit" class="btn">Send</button>
                </div>
            </div>
        </div>
    </div>
    <div class="spacer60"></div>

    <div class="footer">
        <div class="logo-footer">
            <img src="images/backgrounds/decamp-fantastic-fries-logo-white.png" alt="Logo">
        </div>

        <div class="footer-phone-hours">
            <span class="phone">
                555 555 5555
            </span>

            <span class="hours">
                10 am - midnight
            </span>
        </div>

        <div class="links-wrapper">
            <div class="nav-link">
                <a href="index.html">Home</a>
            </div>

            <div class="nav-link">
                <a href="about.html">About</a>
            </div>
            
            <div class="nav-link">
                <a href="menu.html">Menu</a>
            </div>

            <div class="nav-link">
                <a href="contact.html">Contact</a>
            </div>
        </div>

        <div class="social-media-icons-wrapper">
            <div class="end">
                <a href="#" >
                    <img src="images/icons/instagram.png"/>
                </a>
            </div>
            <div class="end">
                <a href="#" >
                    <img src="images/icons/twitter.png"/>
                </a>
            </div>
            <div class="end">
                <a href="#">
                    <img src="images/icons/facebook.png"/>
                </a>
            </div>
        </div>

        <div class="copyright-wrapper">
            © 2018 DevCamp | All rights reserved
        </div>
    </div>
</body>
</html>
